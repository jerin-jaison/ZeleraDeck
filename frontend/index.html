    <!-- ── Performance: Preconnect to external origins ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cloudinary (product images) -->
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- ── Hide Material Symbols text until font stylesheet loads (with 3s fallback) ── -->
    <style>
      .material-symbols-outlined {
        visibility: hidden;
      }
      .fonts-loaded .material-symbols-outlined {
        visibility: visible;
      }
    </style>
    <script>
      (function() {
        function showIcons() {
          document.documentElement.classList.add('fonts-loaded');
        }
        if ('fonts' in document) {
          document.fonts.load('24px "Material Symbols Outlined"').then(showIcons).catch(showIcons);
        }
        setTimeout(showIcons, 3000);
      })();
    </script>

    <!-- ── Non-render-blocking Google Fonts & Icons ── -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Jost:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Jost:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      onload="this.onload=null;this.rel='stylesheet';document.documentElement.classList.add('fonts-loaded');"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <script type="text/javascript">
      window.addEventListener('load', function() {
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "wbzhs2z6qe");
      }, { once: true });
    </script>

  <body>
    <div id="root">
      <style>
        .loading-screen {
          position: fixed; inset: 0; background: #FFFFFF;
          display: flex; align-items: center; justify-content: center;
          z-index: 9999;
        }
        .loading-spinner {
          width: 28px; height: 28px;
          border: 3px solid #F0F0F0; border-top: 3px solid #0A0A0A;
          border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <div class="loading-screen">
        <div class="loading-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
